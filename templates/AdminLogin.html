{% extends 'base.html' %}
{% load static %}
{% block contents %}
<div class="content d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 440px; border-radius: 14px; background: rgba(255, 255, 255, 0.95); color: #2c3e50;">
        <div class="text-center mb-4">
            <div class="mb-2 text-warning">
                <i class="fas fa-user-shield fa-4x"></i>
            </div>
            <h3 class="font-weight-bold mb-1" style="color: #0f2027;">Admin Portal</h3>
            <p class="text-muted small">Governance & RBAC authorization console</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center small py-2 mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'AdminLoginCheck' %}" method="POST">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label class="font-weight-bold text-dark small">Admin Username</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0"><i class="fas fa-user text-muted"></i></span>
                    </div>
                    <input type="text" class="form-control border-left-0" name="loginid" required placeholder="Default: admin" value="admin">
                </div>
            </div>

            <div class="form-group mb-4">
                <label class="font-weight-bold text-dark small">Master Key / Password</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0"><i class="fas fa-key text-muted"></i></span>
                    </div>
                    <input type="password" class="form-control border-left-0" name="pswd" required placeholder="Default: admin" value="admin">
                </div>
            </div>

            <button class="btn btn-dark btn-block btn-lg font-weight-bold shadow-sm mb-2" type="submit" style="border-radius: 8px; background: #0f2027;">
                <i class="fas fa-lock-open mr-1"></i> Access Admin Console
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <small class="text-muted">Standard analyst? <a href="{% url 'UserLogin' %}" class="font-weight-bold text-primary">User Login</a></small>
        </div>
    </div>
</div>
{% endblock %}
