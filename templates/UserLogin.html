{% extends 'base.html' %}
{% load static %}
{% block contents %}
<div class="content d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 440px; border-radius: 14px; background: rgba(255, 255, 255, 0.95); color: #2c3e50;">
        <div class="text-center mb-4">
            <div class="mb-2 text-primary">
                <i class="fas fa-user-circle fa-4x"></i>
            </div>
            <h3 class="font-weight-bold mb-1" style="color: #1e3c72;">Analyst Login</h3>
            <p class="text-muted small">Access your predictive currency analytics dashboard</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %} text-center small py-2 mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'UserLoginCheck' %}" method="POST">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label class="font-weight-bold text-dark small">Login ID</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0"><i class="fas fa-id-badge text-muted"></i></span>
                    </div>
                    <input type="text" class="form-control border-left-0" name="loginid" required placeholder="Enter Login ID">
                </div>
            </div>

            <div class="form-group mb-4">
                <label class="font-weight-bold text-dark small">Password</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text bg-light border-right-0"><i class="fas fa-lock text-muted"></i></span>
                    </div>
                    <input type="password" class="form-control border-left-0" name="pswd" required placeholder="Enter Password">
                </div>
            </div>

            <button class="btn btn-primary btn-block btn-lg font-weight-bold shadow-sm mb-2" type="submit" style="border-radius: 8px;">
                <i class="fas fa-sign-in-alt mr-1"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <small class="text-muted">Don't have an approved account? <a href="{% url 'UserRegisterForm' %}" class="font-weight-bold text-primary">Register Here</a></small>
        </div>
    </div>
</div>
{% endblock %}
